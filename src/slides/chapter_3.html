<li>Giới thiệu về nén ảnh</li>

<h1 id="m%E1%BB%A5c-ti%C3%AAu-h%E1%BB%8Dc-t%E1%BA%ADp">MỤC TIÊU HỌC TẬP</h1>
<p>Sau khi hoàn thành chương này, sinh viên có thể:</p>
<p><strong>Kiến thức cơ bản:</strong></p>
<ul>
<li>Giải thích được tại sao cần nén ảnh</li>
<li>Phân biệt được dữ liệu, thông tin và dư thừa dữ liệu</li>

</ul>
<p><strong>Phân loại và mô hình:</strong></p>
<ul>
<li>Giải thích được sự khác nhau giữa nén không tổn thất (Lossless) và nén có tổn thất (Lossy)</li>
<li>Mô tả được mô hình tổng quát của một hệ thống nén ảnh</li>
</ul>
<p><strong>Kỹ thuật nén:</strong></p>
<ul>
<li>Hiểu nguyên lý của các kỹ thuật: Huffman, Golomb/Golomb-Rice, Arithmetic Coding, LZW, RLE, DPCM, DCT và Block Transform Coding, Wavelet/DWT</li>
<li>Giải thích được quy trình cơ bản của JPEG</li>
</ul>
<p><strong>Đánh giá:</strong></p>
<ul>
<li>Đánh giá được ảnh sau nén bằng một số tiêu chí định lượng và định tính</li>
</ul>
</section>

<ul>
<li>Ảnh màu có kích thước 4000 × 3000 pixel</li>
<li>Mỗi pixel gồm 3 kênh màu:
<ul>
<li>R (Red): 8 bit</li>
<li>G (Green): 8 bit</li>
<li>B (Blue): 8 bit</li>

</li>
</ul>

<h1 id="n%C3%A9n-%E1%BA%A3nh-l%C3%A0-g%C3%AC">NÉN ẢNH LÀ GÌ?</h1>
<p><strong>Định nghĩa:</strong> Nén ảnh (Image Compression) là quá trình giảm số bit cần thiết để biểu diễn một ảnh.</p>
<p><strong>Mục tiêu:</strong> Giảm dung lượng dữ liệu nhưng vẫn đáp ứng yêu cầu về khả năng khôi phục và chất lượng ảnh</p>
<p><strong>Phân loại theo khả năng khôi phục:</strong></p>
<div class="columns">
<div>
<p><strong>1. Nén không tổn thất (Lossless):</strong></p>
<ul>
<li>Ảnh sau giải nén giống hệt ảnh gốc</li>
<li>Không mất bất kỳ thông tin nào</li>
</ul>
</div>
<div>
<p><strong>2. Nén có tổn thất (Lossy):</strong></p>
<ul>
<li>Ảnh sau giải nén khác ảnh gốc</li>
<li>Vẫn đạt chất lượng chấp nhận được</li>
<li>Một phần thông tin bị loại bỏ</li>
</ul>
</div>
</div>
<p><strong>Quy trình tổng quát:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Ảnh gốc → [NÉN] → Dữ liệu nhỏ hơn → [GIẢI NÉN] → Ảnh khôi phục
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="t%E1%BA%A1i-sao-d%E1%BB%AF-li%E1%BB%87u-%E1%BA%A3nh-c%C3%B3-th%E1%BB%83-n%C3%A9n">TẠI SAO DỮ LIỆU ẢNH CÓ THỂ NÉN?</h1>
<p><strong>Nguyên lý cơ bản:</strong> Một ảnh không phải là tập hợp các pixel hoàn toàn độc lập.</p>
<p><strong>Các đặc điểm tạo ra khả năng nén:</strong></p>
<div class="columns">
<div>
<p><strong>1. Sự lặp lại:</strong></p>
<ul>
<li>Các giá trị pixel lặp lại trong ảnh</li>
<li>Ví dụ: Vùng trời xanh có nhiều pixel cùng giá trị</li>
</ul>
<p><strong>2. Tương quan không gian:</strong></p>
<ul>
<li>Các pixel lân cận thường có giá trị tương tự nhau</li>
<li>Ví dụ: Pixel ở giữa vùng da người có giá trị gần giống pixel xung quanh</li>
</ul>
</div>
<div>
<p><strong>3. Phân bố không đều:</strong></p>
<ul>
<li>Một số giá trị xuất hiện thường xuyên hơn các giá trị khác</li>
<li>Ví dụ: Trong ảnh văn bản, màu trắng xuất hiện nhiều hơn màu đen</li>
</ul>
<p><strong>4. Giới hạn của thị giác:</strong></p>
<ul>
<li>Một số chi tiết ít quan trọng đối với thị giác con người</li>
<li>Mắt người không nhận biết được mọi thay đổi nhỏ</li>
</ul>
</div>
</div>
<p><strong>Kết luận:</strong> Những đặc điểm này tạo ra <strong>dư thừa dữ liệu (redundancy)</strong>. Nén ảnh chủ yếu là quá trình khai thác và loại bỏ hoặc biểu diễn hiệu quả các dạng dư thừa này.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="section" data-theme="eaut" lang="en-US" class="section" data-marpit-pagination="8" style="--paginate:true;--class:section;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%C4%91o-l%C6%B0%E1%BB%9Dng-th%C3%B4ng-tin-v%C3%A0-ch%E1%BA%A5t-l%C6%B0%E1%BB%A3ng-%E1%BA%A3nh">Đo lường thông tin và chất lượng ảnh</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="d%E1%BB%AF-li%E1%BB%87u-v%C3%A0-th%C3%B4ng-tin">DỮ LIỆU VÀ THÔNG TIN</h1>
<div class="columns">
<div>
<p><strong>Dữ liệu (Data):</strong></p>
<ul>
<li>Là phương tiện dùng để biểu diễn và lưu trữ thông tin</li>
<li>Mang tính kỹ thuật, có thể đo đếm được</li>
</ul>
<p><strong>Ví dụ về dữ liệu:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>128 129 130 130 131 131 131 ...
</code></pre>
<p>Đây là dãy giá trị pixel của một vùng ảnh.</p>
<p><strong>Thông tin (Information):</strong></p>
<ul>
<li>Là nội dung có ý nghĩa được truyền tải bởi dữ liệu</li>
<li>Mang tính ngữ nghĩa, phụ thuộc vào ngữ cảnh</li>
</ul>
</div>
<div>
<p><strong>Ví dụ về thông tin:</strong></p>
<ul>
<li>Một vùng ảnh có màu xanh</li>
<li>Một đường biên giữa hai đối tượng</li>
<li>Một ký tự trong văn bản</li>
<li>Một khuôn mặt trong ảnh chân dung</li>
</ul>
<p><strong>Ý tưởng cốt lõi của nén ảnh:</strong></p>
<ul>
<li>Giảm số bit dùng để biểu diễn dữ liệu</li>
<li>Vẫn bảo toàn thông tin cần thiết theo mục đích sử dụng</li>
<li>Có thể loại bỏ dữ liệu dư thừa mà không mất thông tin quan trọng</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="t%E1%BB%B7-l%E1%BB%87-n%C3%A9n">TỶ LỆ NÉN</h1>
<p><strong>Định nghĩa các đại lượng:</strong></p>

<h1 id="d%C6%B0-th%E1%BB%ABa-d%E1%BB%AF-li%E1%BB%87u">DƯ THỪA DỮ LIỆU</h1>
<p><strong>Định nghĩa:</strong> Dư thừa dữ liệu (Redundancy) là phần biểu diễn dữ liệu có thể được loại bỏ hoặc mã hóa hiệu quả hơn mà không làm mất thông tin cần thiết.</p>
<p><strong>Cấu trúc của dữ liệu ảnh:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Dữ liệu ảnh
├── Thông tin cần thiết (giữ lại)
└── Dư thừa (có thể loại bỏ hoặc mã hóa hiệu quả)
    ├── Dư thừa mã hóa (Coding Redundancy)
    ├── Dư thừa không gian (Spatial Redundancy)
    └── Thông tin không liên quan (Irrelevant Information)
</code></pre>
<p><strong>Nguyên lý nén ảnh:</strong></p>
<ul>
<li>Khai thác các dạng dư thừa</li>
<li>Biểu diễn dữ liệu hiệu quả hơn</li>
<li>Giảm số bit cần thiết mà vẫn giữ được thông tin quan trọng</li>
</ul>
<p><strong>Ví dụ:</strong> Thay vì lưu từng pixel riêng lẻ, có thể lưu &quot;100 pixel màu trắng liên tiếp&quot; chỉ bằng một cặp giá trị (màu, số lượng).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="c%C3%A1c-lo%E1%BA%A1i-d%C6%B0-th%E1%BB%ABa-trong-%E1%BA%A3nh">CÁC LOẠI DƯ THỪA TRONG ẢNH</h1>
<div class="columns">
<div>
<p><strong>1. Dư thừa mã hóa (Coding Redundancy)</strong></p>
<p><strong>Định nghĩa:</strong> Xảy ra khi dùng nhiều bit hơn mức cần thiết để biểu diễn các giá trị có xác suất xuất hiện khác nhau.</p>
<p><strong>Ví dụ:</strong> Nếu giá trị &quot;0&quot; xuất hiện 80% thời gian nhưng vẫn được mã hóa bằng 8 bit như các giá trị khác.</p>
<p><strong>Kỹ thuật khai thác:</strong></p>
<ul>
<li>Huffman Coding</li>
<li>Arithmetic Coding</li>
<li>Golomb Coding</li>
</ul>
</div>
<div>
<p><strong>2. Dư thừa không gian (Spatial Redundancy)</strong></p>
<p><strong>Định nghĩa:</strong> Các pixel lân cận thường có quan hệ mạnh với nhau.</p>
<p><strong>Ví dụ:</strong> Trong vùng trời xanh, các pixel liên tiếp có giá trị gần giống nhau.</p>
<p><strong>Kỹ thuật khai thác:</strong></p>
<ul>
<li>RLE (Run-Length Encoding)</li>
<li>DPCM (Differential Pulse Code Modulation)</li>
<li>Transform Coding</li>
</ul>
</div>
<div>
<p><strong>3. Thông tin không liên quan (Irrelevant Information)</strong></p>
<p><strong>Định nghĩa:</strong> Một số thông tin ít ảnh hưởng đến cảm nhận của con người hoặc không cần thiết cho ứng dụng.</p>
<p><strong>Ví dụ:</strong> Các chi tiết rất nhỏ mà mắt người không nhận ra.</p>
<p><strong>Kỹ thuật khai thác:</strong></p>
<ul>
<li>Quantization (Lượng tử hóa)</li>
<li>JPEG</li>
<li>Wavelet compression</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="ba-h%C6%B0%E1%BB%9Bng-ti%E1%BA%BFp-c%E1%BA%ADn-ch%C3%ADnh">BA HƯỚNG TIẾP CẬN CHÍNH</h1>
<p>Có thể nhìn toàn bộ chương thông qua ba câu hỏi cốt lõi:</p>
<div style="color:red">
<p><strong>Câu hỏi 1: Có thể dùng ít bit hơn để biểu diễn cùng thông tin không?</strong></p>
</div>
<ul>
<li><strong>Hướng tiếp cận:</strong> Coding (Mã hóa thống kê)</li>
<li><strong>Ví dụ:</strong> Huffman, Arithmetic Coding, Golomb</li>
<li><strong>Nguyên lý:</strong> Gán mã ngắn cho ký hiệu xuất hiện thường xuyên, mã dài cho ký hiệu hiếm.</li>
</ul>
<div style="color:red">
<p><strong>Câu hỏi 2: Có thể biểu diễn phần thay đổi thay vì toàn bộ dữ liệu không?</strong></p>
</div>
<ul>
<li><strong>Hướng tiếp cận:</strong> Prediction / Transform (Dự đoán / Biến đổi)</li>
<li><strong>Ví dụ:</strong> DPCM, DCT (Discrete Cosine Transform)</li>
<li><strong>Nguyên lý:</strong> Chỉ mã hóa sự khác biệt hoặc biến đổi, không mã hóa toàn bộ giá trị.</li>
</ul>
<div style="color:red">
<p><strong>Câu hỏi 3: Có thông tin nào ít quan trọng có thể bỏ qua không?</strong></p>
</div>
<ul>
<li><strong>Hướng tiếp cận:</strong> Quantization (Lượng tử hóa)</li>
<li><strong>Ví dụ:</strong> JPEG, JPEG 2000</li>
<li><strong>Nguyên lý:</strong> Loại bỏ hoặc làm mịn các chi tiết không quan trọng.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">

</ul>

<h1 id="%C3%BD-ngh%C4%A9a-c%E1%BB%A7a-entropy">Ý NGHĨA CỦA ENTROPY</h1>
<p>Entropy phản ánh mức độ không chắc chắn / khó dự đoán của nguồn dữ liệu.</p>
<p><strong>Trường hợp 1: Entropy cao</strong></p>
<p><strong>Đặc điểm:</strong></p>
<ul>
<li>Các giá trị có xác suất tương đối đồng đều</li>
<li>Khó dự đoán giá trị tiếp theo</li>
<li>Khó nén bằng các phương pháp thống kê đơn giản</li>
</ul>
<p><strong>Ví dụ:</strong> Ảnh nhiễu ngẫu nhiên, các mức xám xuất hiện với xác suất gần bằng nhau.</p>
<p><strong>Trường hợp 2: Entropy thấp</strong></p>
<p><strong>Đặc điểm:</strong></p>
<ul>
<li>Một số giá trị xuất hiện áp đảo</li>
<li>Dễ dự đoán giá trị tiếp theo</li>
<li>Có khả năng mã hóa bằng ít bit hơn</li>
</ul>
<p><strong>Ví dụ:</strong> Ảnh văn bản, vùng ảnh đồng nhất, các pixel có giá trị tương tự nhau.</p>
<p><strong>Kết luận:</strong> Entropy thấp thường tạo nhiều cơ hội cho nén thống kê.</p>
</section>

<h1 id="%C4%91%C3%A1nh-gi%C3%A1-ch%E1%BA%A5t-l%C6%B0%E1%BB%A3ng-%E1%BA%A3nh-sau-n%C3%A9n">ĐÁNH GIÁ CHẤT LƯỢNG ẢNH SAU NÉN</h1>
<p><strong>Vấn đề:</strong> Khi nén Lossy, ảnh giải nén có thể khác ảnh gốc. Do đó cần đánh giá mức độ sai khác.</p>
<p><strong>Hai nhóm tiêu chí đánh giá:</strong></p>
<div class="columns">
<div class="col-5">
<p><strong>1. Đánh giá khách quan (Objective Assessment)</strong></p>
<p><strong>Đặc điểm:</strong> Dựa trên các đại lượng tính toán được từ dữ liệu</p>
<p><strong>Các chỉ số phổ biến:</strong></p>
<ul>
<li><strong>MSE</strong> (Mean Squared Error): Sai số bình phương trung bình</li>
<li><strong>RMSE</strong> (Root Mean Squared Error): Căn bậc hai của MSE</li>
<li><strong>SNR</strong> (Signal-to-Noise Ratio): Tỷ lệ tín hiệu trên nhiễu</li>
<li><strong>PSNR</strong> (Peak Signal-to-Noise Ratio): Tỷ lệ tín hiệu đỉnh trên nhiễu</li>
</ul>
<p><strong>Ưu điểm:</strong> Khách quan, có thể tự động tính toán<br />
<strong>Nhược điểm:</strong> Không phải lúc nào cũng phản ánh chính xác cảm nhận thị giác</p>
</div>
<div class="col-4">
<p><strong>2. Đánh giá chủ quan (Subjective Assessment)</strong></p>
<p><strong>Đặc điểm:</strong> Dựa trên quan sát và cảm nhận của con người</p>
<p><strong>Các yếu tố đánh giá:</strong></p>
<ul>
<li>Độ sắc nét của ảnh</li>
<li>Chi tiết được giữ lại</li>
<li>Mức độ nhiễu</li>
<li>Artifact (các biến dạng do nén)</li>
<li>Khả năng nhận biết nội dung</li>
</ul>
<p><strong>Ưu điểm:</strong> Phản ánh cảm nhận thực tế<br />
<strong>Nhược điểm:</strong> Chủ quan, tốn thời gian, khó tự động hóa</p>
</div>
</div>
</section>

<p><strong>Ý nghĩa:</strong></p>
<ul>
<li>MSE càng nhỏ → PSNR càng lớn</li>
<li>PSNR lớn thường tương ứng với sai khác pixel nhỏ hơn</li>
<li>Đơn vị: dB (decibel)</li>
</ul>
<p><strong>Ngưỡng tham khảo:</strong></p>
<ul>
<li>PSNR &gt; 40 dB: Chất lượng rất tốt, khó nhận biết sai khác</li>
<li>PSNR 30-40 dB: Chất lượng tốt</li>
<li>PSNR 20-30 dB: Chất lượng chấp nhận được</li>
<li>PSNR &lt; 20 dB: Chất lượng kém, có thể nhận biết rõ sai khác.</li>
</ul>
</section>

<h1 id="%C4%91%C3%A1nh-gi%C3%A1-ch%E1%BB%A7-quan">ĐÁNH GIÁ CHỦ QUAN</h1>
<p><strong>Vấn đề:</strong> Hai ảnh có thể có MSE hoặc PSNR tương tự nhau nhưng cảm nhận của con người khác nhau.</p>
<p><strong>Các yếu tố cần quan sát khi đánh giá trực quan:</strong></p>
<div class="columns">
<div>
<p><strong>1. Biên ảnh (Edges):</strong></p>
<ul>
<li>Biên có bị mờ không?</li>
<li>Biên có bị răng cưa không?</li>
</ul>
<p><strong>2. Chi tiết nhỏ:</strong></p>
<ul>
<li>Các chi tiết nhỏ có được giữ lại không?</li>
<li>Texture có bị mất không?</li>
</ul>
<p><strong>3. Vùng chuyển sắc:</strong></p>
<ul>
<li>Các vùng chuyển màu có mượt mà không?</li>
<li>Có xuất hiện hiện tượng banding không?</li>
</ul>
</div>
<div>
<p><strong>4. Nhiễu và Artifact:</strong></p>
<ul>
<li><strong>Blocking artifact:</strong> Các khối 8×8 trở nên rõ rệt (trong JPEG)</li>
<li><strong>Ringing artifact:</strong> Dao động hoặc viền quanh các cạnh mạnh</li>
<li><strong>Blurring:</strong> Ảnh bị mờ, mất chi tiết</li>
</ul>
<p><strong>5. Khả năng nhận biết:</strong></p>
<ul>
<li>Đối tượng chính có dễ nhận biết không?</li>
<li>Nội dung ảnh có còn rõ ràng không?</li>
</ul>
</div>
</div>
<p><strong>Kết luận:</strong> Đánh giá chủ quan bổ sung cho đánh giá khách quan, giúp hiểu rõ hơn về chất lượng thực tế của ảnh nén.</p>
</section>

<h1 id="h%E1%BB%87-th%E1%BB%91ng-n%C3%A9n-d%E1%BB%AF-%E1%BA%A3nh">HỆ THỐNG NÉN DỮ ẢNH</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="hai-nh%C3%B3m-ph%C6%B0%C6%A1ng-ph%C3%A1p-n%C3%A9n-ch%C3%ADnh">Hai nhóm phương pháp nén chính</h1>
<div class="columns">
<div>

<p><strong>Đặc điểm:</strong></p>
<ul>
<li>Có mất thông tin</li>
<li>Tỷ lệ nén cao hơn</li>
<li>Chất lượng phụ thuộc vào mức độ nén</li>
</ul>
</div>
</div>
<p><strong>Lựa chọn phương pháp:</strong></p>
<ul>
<li>Cần bảo toàn tuyệt đối → Lossless</li>
<li>Chấp nhận mất một phần để đạt tỷ lệ nén cao → Lossy</li>
</ul>
</section>

<h1 id="n%C3%A9n-kh%C3%B4ng-t%E1%BB%95n-th%E1%BA%A5t---lossless">NÉN KHÔNG TỔN THẤT - LOSSLESS</h1>
<div class="columns">
<div class="col-3">
<p><strong>Nguyên lý:</strong> Loại bỏ dư thừa, không loại bỏ thông tin cần thiết, mọi thông tin đều được giữ lại</p>
<p><strong>Ưu điểm:</strong></p>
<ul>
<li>Khôi phục chính xác ảnh gốc</li>
<li>Không tạo sai số do quá trình nén</li>
<li>Có thể nén và giải nén nhiều lần mà không tích lũy sai số</li>
</ul>
<p><strong>Nhược điểm:</strong></p>
<ul>
<li>Tỷ lệ nén thường thấp hơn Lossy</li>
<li>Thường chỉ đạt 2:1 đến 5:1</li>
</ul>
</div>
<div class="col-4">
<p><strong>Ứng dụng:</strong></p>
<ul>
<li><strong>Ảnh y tế:</strong> Cần bảo toàn mọi chi tiết để chẩn đoán</li>
<li><strong>Tài liệu:</strong> Văn bản, hợp đồng cần giữ nguyên</li>
<li><strong>Đồ họa:</strong> Logo, icon cần biên sắc nét</li>
<li><strong>Dữ liệu khoa học:</strong> Cần độ chính xác tuyệt đối</li>
</ul>
<p><strong>Ví dụ định dạng:</strong></p>
<ul>
<li><strong>PNG:</strong> Phổ biến cho đồ họa web</li>
<li><strong>Một số chế độ của JPEG 2000:</strong> Hỗ trợ lossless</li>
<li><strong>GIF:</strong> Cho ảnh đơn giản</li>
<li><strong>TIFF:</strong> Cho ảnh chất lượng cao</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="text-xs" data-theme="eaut" lang="en-US" class="text-xs" data-marpit-pagination="27" style="--paginate:true;--class:text-xs;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="n%C3%A9n-c%C3%B3-t%E1%BB%95n-th%E1%BA%A5t---lossy">NÉN CÓ TỔN THẤT - LOSSY</h1>
<div class="columns">
<div>
<p><strong>Nguyên lý:</strong> Chấp nhận loại bỏ một phần thông tin.</p>
<p><strong>Các nguồn thông tin có thể loại bỏ:</strong></p>
<p><strong>1. Đặc điểm của hệ thống thị giác:</strong></p>
<ul>
<li>Mắt người không nhạy với mọi thay đổi nhỏ</li>
<li>Không nhận biết được một số chi tiết rất nhỏ</li>
</ul>
<p><strong>2. Thành phần tần số:</strong></p>
<ul>
<li>Thành phần tần số cao ít quan trọng hơn tần số thấp</li>
<li>Có thể loại bỏ hoặc làm mịn</li>
</ul>
<p><strong>3. Chi tiết khó nhận biết:</strong></p>
<ul>
<li>Các chi tiết nhỏ trong vùng phức tạp</li>
<li>Thay đổi màu sắc rất nhỏ</li>
</ul>
<p><strong>Ưu điểm:</strong></p>
<ul>
<li>Tỷ lệ nén cao (có thể đạt 10:1, 20:1 hoặc hơn)</li>
<li>Giảm đáng kể dung lượng lưu trữ</li>
</ul>
</div>
<div>
<p><strong>Nhược điểm:</strong></p>
<ul>
<li>Ảnh khôi phục không hoàn toàn giống ảnh gốc</li>
<li>Chất lượng phụ thuộc mức độ nén</li>
<li>Nén nhiều lần có thể tích lũy sai số</li>
</ul>
<p><strong>Ứng dụng:</strong></p>
<ul>
<li>Ảnh chụp (photography)</li>
<li>Ảnh web, multimedia</li>
<li>Streaming video</li>
<li>Các ứng dụng không yêu cầu độ chính xác tuyệt đối</li>
</ul>
<p><strong>Ví dụ định dạng:</strong></p>
<ul>
<li><strong>JPEG:</strong> Phổ biến nhất cho ảnh chụp</li>
<li><strong>JPEG 2000:</strong> Chuẩn mới hơn</li>
<li><strong>WebP:</strong> Cho web hiện đại</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="so-s%C3%A1nh-lossless-v%C3%A0-lossy">SO SÁNH LOSSLESS VÀ LOSSY</h1>
<table>
<thead>
<tr>
<th>Đặc điểm</th>
<th>Lossless</th>
<th>Lossy</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Mất thông tin</strong></td>
<td>Không</td>
<td>Có</td>
</tr>
<tr>
<td><strong>Khôi phục chính xác</strong></td>
<td>Có</td>
<td>Không</td>
</tr>
<tr>
<td><strong>Tỷ lệ nén</strong></td>
<td>Thường thấp hơn (2:1 - 5:1)</td>
<td>Thường cao hơn (10:1 - 50:1)</td>
</tr>
<tr>
<td><strong>Chất lượng ảnh</strong></td>
<td>Giữ nguyên 100%</td>
<td>Có thể giảm tùy mức nén</td>
</tr>
<tr>
<td><strong>Ảnh y tế</strong></td>
<td>Phù hợp</td>
<td>Cần cân nhắc kỹ</td>
</tr>
<tr>
<td><strong>Ảnh web</strong></td>
<td>Có thể dùng</td>
<td>Rất phổ biến</td>
</tr>
<tr>
<td><strong>JPEG</strong></td>
<td>Không (thông thường)</td>
<td>Có</td>
</tr>
<tr>
<td><strong>PNG</strong></td>
<td>Có</td>
<td>Không</td>
</tr>
</tbody>
</table>
<p>Lựa chọn phụ thuộc vào mục đích sử dụng, yêu cầu chất lượng, giới hạn dung lượng.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="h%E1%BB%87-th%E1%BB%91ng-n%C3%A9n-n%C3%A9n-%E1%BA%A3nh">HỆ THỐNG NÉN NÉN ẢNH</h1>
<p><strong>Một hệ thống nén ảnh gồm hai phần chính:</strong></p>
<div class="columns">
<div>
<p><strong>1. Encoder (Bộ mã hóa):</strong></p>
<ul>
<li>Biến dữ liệu ảnh thành biểu diễn ngắn gọn hơn</li>
<li>Thực hiện quá trình nén</li>
</ul>
<p><strong>2. Decoder (Bộ giải mã):</strong></p>
<ul>
<li>Khôi phục ảnh từ biểu diễn đã nén</li>
<li>Thực hiện quá trình giải nén</li>
</ul>
</div>
<div>
<p><strong>Các thành phần trong Encoder:</strong></p>
<ul>
<li>Mapper/Transform: Biến đổi dữ liệu</li>
<li>Quantizer: Lượng tử hóa (chỉ trong Lossy)</li>
<li>Symbol Coder: Mã hóa ký hiệu</li>
</ul>
<p><strong>Các thành phần trong Decoder:</strong></p>
<ul>
<li>Symbol Decoder: Giải mã ký hiệu</li>
<li>Inverse Quantizer: Lượng tử hóa ngược (chỉ trong Lossy)</li>
<li>Inverse Mapper: Biến đổi ngược</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="section" data-theme="eaut" lang="en-US" class="section" data-marpit-pagination="30" style="--paginate:true;--class:section;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="n%C3%A9n-kh%C3%B4ng-t%E1%BB%95n-th%E1%BA%A5t">NÉN KHÔNG TỔN THẤT</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="c%C3%A1c-k%E1%BB%B9-thu%E1%BA%ADt-ti%C3%AAu-bi%E1%BB%83u">CÁC KỸ THUẬT TIÊU BIỂU</h1>
<p><strong>Các kỹ thuật Lossless phổ biến:</strong></p>
<div class="columns">
<div>
<p><strong>1. Huffman Coding</strong></p>
<ul>
<li>Mã hóa độ dài thay đổi</li>
<li>Gán mã ngắn cho ký hiệu phổ biến</li>
</ul>
<p><strong>2. Golomb / Golomb-Rice</strong></p>
<ul>
<li>Phù hợp với số nguyên có phân bố lệch</li>
<li>Hiệu quả với dữ liệu có nhiều giá trị nhỏ</li>
</ul>
<p><strong>3. Arithmetic Coding</strong></p>
<ul>
<li>Mã hóa chuỗi bằng khoảng số thực</li>
<li>Đạt hiệu quả gần giới hạn entropy</li>
</ul>
<p><strong>4. LZW (Lempel-Ziv-Welch)</strong></p>
<ul>
<li>Sử dụng từ điển chuỗi</li>
<li>Khai thác chuỗi lặp lại</li>
</ul>
</div>
<div>
<p><strong>5. Run-Length Encoding (RLE)</strong></p>
<ul>
<li>Mã hóa chuỗi giá trị giống nhau</li>
<li>Hiệu quả với vùng đồng nhất</li>
</ul>
<p><strong>6. JBIG2</strong></p>
<ul>
<li>Chuyên cho ảnh nhị phân</li>
<li>Phù hợp với tài liệu</li>
</ul>
<p><strong>7. Bit-plane coding</strong></p>
<ul>
<li>Tách ảnh thành các mặt phẳng bit</li>
<li>Xử lý từng mặt phẳng riêng</li>
</ul>
<p><strong>Nguyên lý chung:</strong> Tất cả các kỹ thuật này đều khai thác các dạng dư thừa khác nhau để giảm số bit mà không mất thông tin.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="huffman-coding">HUFFMAN CODING</h1>
<div class="columns">
<div>
<p><strong>Định nghĩa:</strong> Huffman Coding là phương pháp mã hóa độ dài thay đổi.</p>
<p><strong>Nguyên tắc:</strong></p>
<ul>
<li>Ký hiệu xuất hiện càng thường xuyên → mã càng ngắn</li>
<li>Ký hiệu hiếm → mã dài hơn</li>
</ul>
<p><strong>Ví dụ minh họa:</strong></p>
<table>
<thead>
<tr>
<th>Ký hiệu</th>
<th>Tần suất</th>
<th>Mã Huffman</th>
</tr>
</thead>
<tbody>
<tr>
<td>A</td>
<td>Cao</td>
<td>0</td>
</tr>
<tr>
<td>B</td>
<td>Trung bình</td>
<td>10</td>
</tr>
<tr>
<td>C</td>
<td>Thấp</td>
<td>110</td>
</tr>
<tr>
<td>D</td>
<td>Rất thấp</td>
<td>111</td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>Lợi ích:</strong></p>
<ul>
<li>Giảm số bit trung bình cần thiết</li>
<li>Tối ưu hóa theo phân bố xác suất</li>
</ul>
<p><strong>Đặc điểm quan trọng:</strong></p>
<ul>
<li>Mã prefix: Không có mã nào là tiền tố của mã khác</li>
<li>Có thể giải mã duy nhất</li>
<li>Không cần dấu phân cách giữa các ký hiệu</li>
</ul>
<p><strong>Ví dụ:</strong> Chuỗi &quot;ABCA&quot; được mã hóa thành &quot;0 10 110 0&quot; và có thể giải mã ngược lại mà không cần biết ranh giới giữa các ký hiệu.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="x%C3%A2y-d%E1%BB%B1ng-c%C3%A2y-huffman">XÂY DỰNG CÂY HUFFMAN</h1>
<div class="columns">
<div class="col-2">
<p><strong>Quy trình xây dựng cây Huffman:</strong></p>
<p><strong>Bước 1: Tính tần suất</strong></p>
<ul>
<li>Đếm tần suất hoặc xác suất của các ký hiệu</li>
</ul>
<p><strong>Bước 2: Sắp xếp</strong></p>
<ul>
<li>Sắp xếp các ký hiệu theo tần suất tăng dần</li>
</ul>
<p><strong>Bước 3: Chọn hai nút nhỏ nhất</strong></p>
<ul>
<li>Chọn hai nút có tần suất nhỏ nhất</li>
</ul>
</div>
<div class="col-3">
<p><strong>Bước 4: Gộp nút</strong></p>
<ul>
<li>Gộp hai nút thành một nút mới</li>
<li>Tần suất nút mới = tổng tần suất hai nút con</li>
</ul>
<p><strong>Bước 5: Lặp lại</strong></p>
<ul>
<li>Lặp lại bước 3-4 cho đến khi còn một nút gốc</li>
</ul>
<p><strong>Bước 6: Gán mã</strong></p>
<ul>
<li>Nhánh trái → 0</li>
<li>Nhánh phải → 1</li>
<li>Mã của ký hiệu là đường đi từ gốc đến nút lá</li>
</ul>
</div>
</div>
<p><gap></gap></p>
<p><strong>Ví dụ:</strong> Với 4 ký hiệu A, B, C, D có tần suất khác nhau, ta xây dựng cây nhị phân từ dưới lên, gán mã 0/1 cho mỗi nhánh, và đọc mã từ gốc đến lá.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="huffman---m%C3%A3-h%C3%B3a-v%C3%A0-gi%E1%BA%A3i-m%C3%A3">HUFFMAN - MÃ HÓA VÀ GIẢI MÃ</h1>
<div class="columns">
<div>
<p><strong>Quá trình mã hóa:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Ký hiệu
   │
   ▼
Tra bảng mã
   │
   ▼
Chuỗi bit
</code></pre>
<p><strong>Ví dụ:</strong></p>
<ul>
<li>A → 0</li>
<li>B → 10</li>
<li>C → 110</li>
</ul>
<p>Chuỗi &quot;ABCA&quot; được thay bằng: &quot;0 10 110 0&quot;</p>
</div>
<div>
<p><strong>Quá trình giải mã:</strong> Sử dụng cây Huffman:</p>
<ul>
<li>Bắt đầu từ gốc cây</li>
<li>Đọc từng bit:
<ul>
<li>Bit 0: đi sang nhánh trái</li>
<li>Bit 1: đi sang nhánh phải</li>
</ul>
</li>
<li>Khi đến nút lá → thu được một ký hiệu</li>
<li>Quay lại gốc và tiếp tục</li>
</ul>
<p><strong>Ưu điểm:</strong> Giải mã duy nhất, không cần dấu phân cách</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="v%C3%AD-d%E1%BB%A5-m%C3%A3-huffman-1">Ví dụ mã Huffman (1)</h1>
<ul>
<li><strong>Chuỗi cần mã hoá:</strong> &quot;Cộng hoà xã hội chủ nghĩa&quot;</li>
<li><strong>Trước mã hoá:</strong> Chuỗi ký tự ASCII tiêu chuẩn (mỗi ký tự 8 bit).</li>
<li><strong>Sau mã hoá:</strong> Chuỗi bit được rút gọn đáng kể nhờ các ký tự xuất hiện nhiều (như dấu cách, chữ 'a', 'o', 'h') được gán mã ngắn.</li>
</ul>
<p><gap></gap></p>
<p><img src="images/3.3.png" alt="" style="width:900px;" /></p>
<p><gap></gap></p>
<ul>
<li><em>Lưu ý:</em> Cây Huffman hoặc bảng mã cần được lưu kèm hoặc gửi kèm ở phần đầu file nén để bộ giải mã có thể hiểu được.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="v%C3%AD-d%E1%BB%A5-m%C3%A3-huffman-2">Ví dụ mã Huffman (2)</h1>
<div class="columns">
<div class="col-2">
<p><strong>Các bước thực hiện:</strong></p>
<ol>
<li>Tính tần suất xuất hiện của từng ký tự (<strong>bước 1</strong>).</li>
<li>Sắp xếp theo xác suất giảm dần (<strong>bước 2</strong>).</li>
<li>Xây dựng cây Huffman bằng cách gộp 2 nút có tần suất nhỏ nhất (<strong>bước 3,4,5</strong>).</li>
</ol>
</div>
<div class="col-5">
<p><img src="images/3.4.png" alt="" /></p>
</div>
</div>
<ol start="4">
<li>Gán bit 0 cho nhánh trái, 1 cho nhánh phải (<strong>bước 6</strong>).</li>
<li>Đọc đường đi từ gốc đến lá để ra mã của từng ký tự (<strong>giải mã</strong>).</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="huffman-trong-n%C3%A9n-%E1%BA%A3nh">HUFFMAN TRONG NÉN ẢNH</h1>
<p><strong>Áp dụng cho ảnh mức xám:</strong></p>
<div class="columns">
<div>
<p><strong>Quy trình:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Ảnh
  │
  ▼
Phân tích tần suất mức xám
  │
  ▼
Xây dựng Huffman Tree
  │
  ▼
Tạo bảng mã
  │
  ▼
Mã hóa pixel
  │
  ▼
Bitstream
</code></pre>
</div>
<div class="col-2">
<p><strong>Hạn chế:</strong></p>
<ul>
<li>Nếu pixel được xem độc lập, hiệu quả có thể hạn chế</li>
<li>Không khai thác được tương quan không gian</li>
</ul>
<p><strong>Giải pháp trong thực tế:</strong></p>
<ul>
<li>Huffman thường được áp dụng sau các bước biến đổi hoặc dự đoán</li>
<li>Tạo ra dữ liệu có phân bố thuận lợi hơn</li>
</ul>
<p><strong>Ví dụ:</strong></p>
<ul>
<li>Ảnh có vùng đồng nhất → nhiều pixel cùng giá trị → Huffman hiệu quả</li>
<li>Ảnh nhiễu ngẫu nhiên → phân bố đều → Huffman kém hiệu quả</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-golomb--golomb-rice">Mã Golomb &amp; Golomb-Rice</h1>
<div class="columns">
<div>
<ul>
<li><strong>Mã Golomb:</strong>
<ul>

<li><strong>Quy trình:</strong>
<ol>
<li>Khởi tạo khoảng hiện tại là <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.778ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2111.7 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="5B" d="M118 -250V750H255V710H158V-210H255V-250H118Z"></path></g><g data-mml-node="mn" transform="translate(278,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g><g data-mml-node="mo" transform="translate(778,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z"></path></g><g data-mml-node="mn" transform="translate(1222.7,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(1722.7,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container>.</li>
<li>Dựa vào bảng xác suất, chia khoảng hiện tại thành các khoảng con.</li>
<li>Kiểm tra xem con số giải mã nằm trong khoảng con của ký tự nào <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Xuất ký tự đó.</li>
<li>Thu hẹp khoảng hiện tại thành đúng khoảng con vừa tìm được.</li>
<li>Lặp lại cho đến khi giải mã đủ số lượng ký tự.</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-lzw-lempel-ziv-welch">Mã LZW (Lempel-Ziv-Welch)</h1>
<ul>
<li><strong>Nguyên lý:</strong> Thay thế các chuỗi lặp lại bằng một mã số ngắn hơn.</li>
<li><strong>Từ điển động:</strong> LZW xây dựng từ điển trong lúc nén. Khi gặp chuỗi đã xuất hiện, thay bằng mã cố định (thường 9-12 bit).</li>
<li><strong>Cách hoạt động:</strong>
<ol>
<li>Khởi tạo từ điển ban đầu với các ký tự đơn.</li>
<li>Đọc dữ liệu đầu vào để tạo chuỗi hiện tại.</li>
<li>Nếu chuỗi mới đã có trong từ điển, tiếp tục mở rộng.</li>
<li>Nếu chưa có, xuất mã của chuỗi cũ và thêm chuỗi mới vào từ điển.</li>
</ol>
</li>
<li><strong>Điểm hay:</strong> Cả bộ nén và giải nén đều tự xây dựng lại cùng một từ điển mà không cần gửi kèm.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="v%C3%AD-d%E1%BB%A5-m%C3%A3-ho%C3%A1-v%E1%BB%9Bi-lzw">Ví dụ mã hoá với LZW</h1>
<div class="columns">
<div>
<ul>
<li><strong>Mã hoá chuỗi:</strong> &quot;ABAABABA&quot;</li>
<li><strong>Từ điển ban đầu:</strong> A: 65, B: 66 (Mã ASCII)</li>
<li><strong>Các mã mới bắt đầu từ 256.</strong></li>
<li><strong>Quá trình:</strong>
<ul>
<li>Đọc 'A': có trong từ điển.</li>
<li>Đọc 'AB': chưa có <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Xuất mã của 'A' (65), thêm 'AB' vào từ điển (mã 256).</li>
<li>Đọc 'B': có.</li>
</ul>
</li>
</ul>
</div>
<div>
<p><img src="images/3.8.png" alt="" /></p>
</div>
</div>
<ul>
<ul>
<li>Đọc 'BA': chưa có <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Xuất mã 'B' (66), thêm 'BA' (257).</li>
<li>Đọc 'AAB': chưa có <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Xuất mã 'A' (65), thêm 'AA' (258).</li>
<li>... Tiếp tục cho đến hết chuỗi.</li>
</ul>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="gi%E1%BA%A3i-m%C3%A3-lzw">Giải mã LZW</h1>
<ul>
<li><strong>Nguyên lý:</strong> Bộ giải nén tự động xây dựng lại từ điển y hệt bộ nén.</li>
<li><strong>Quy trình:</strong>
<ol>
<li>Khởi tạo từ điển với các ký tự đơn.</li>
<li>Đọc mã đầu tiên, xuất chuỗi tương ứng, lưu làm <code>Chuỗi_trước</code>.</li>
<li>Đọc mã tiếp theo:
<ul>
<li><em>TH1:</em> Mã đã có <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Xuất chuỗi. Thêm vào từ điển <code>Chuỗi_trước</code> + Ký tự đầu của chuỗi hiện tại.</li>
<li><em>TH2 (Đặc biệt):</em> Mã chưa có <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Thêm <code>Chuỗi_trước</code> + Ký tự đầu của <code>Chuỗi_trước</code>, sau đó xuất chuỗi này.</li>
</ul>
</li>
<li>Cập nhật <code>Chuỗi_trước</code> = chuỗi vừa xuất. Lặp lại.</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-h%C3%B3a-%C4%91%E1%BB%99-d%C3%A0i-run-run-length-encoding---rle">Mã hóa độ dài Run (Run-Length Encoding - RLE)</h1>
<div class="columns">
<div>
<ul>
<li><strong>Nguyên lý:</strong> Thay thế chuỗi các pixel giống hệt nhau bằng cặp (Giá trị, Độ dài).</li>
<li><strong>Chuẩn CCITT Group 3 &amp; 4:</strong> Dùng cho ảnh nhị phân (Fax).
<ul>
<li>Group 4 sử dụng mã hóa 2D (READ) tham chiếu dòng trước đó để nén tốt hơn.</li>
</ul>
</li>
</ul>
</div>
<div>
<gap></gap>
<p><img src="images/3.9.png" alt="" /></p>
</div>
</div>
<ul>
<li><strong>Giải mã:</strong> Đọc từng cặp (Giá trị, Độ dài) và ghi liên tiếp Giá trị đó vào ảnh với số lượng bằng Độ dài.</li>
</ul>
<p><gap></gap></p>
<p><img src="images/3.10.png" alt="" style="width:1000px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="rle-tr%C3%AAn-%E1%BA%A3nh">RLE TRÊN ẢNH</h1>
<p><strong>RLE đặc biệt hiệu quả khi ảnh có:</strong></p>
<div class="columns">
<div>
<p><strong>1. Vùng lớn cùng màu:</strong></p>
<ul>
<li>Bầu trời xanh</li>
<li>Tường trắng</li>
<li>Nền đồng nhất</li>
</ul>
<p><strong>2. Nhiều pixel giống nhau liên tiếp:</strong></p>
<ul>
<li>Ảnh nhị phân (đen/trắng)</li>
<li>Tài liệu scan</li>
<li>Logo, icon</li>
</ul>
<p><strong>Ví dụ:</strong></p>
<p>Ảnh có vùng trắng lớn:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>████████████
████████████
████████████
</code></pre>
</div>
<div>
<p>Có thể biểu diễn rất ngắn bằng RLE:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>(Trắng, 36)
</code></pre>
<p><strong>Ứng dụng thực tế:</strong></p>
<ul>
<li>Ảnh fax</li>
<li>Tài liệu văn bản scan</li>
<li>Ảnh đồ họa đơn giản</li>
<li>Định dạng BMP (tùy chọn)</li>
</ul>
<p><strong>Hạn chế:</strong></p>
<p>Nếu ảnh chứa nhiều thay đổi:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>101101001011010...
</code></pre>
</div>
<div>
<p><strong>Kết quả:</strong></p>
<ul>
<li>RLE không giúp giảm kích thước</li>
<li>Thậm chí làm dữ liệu lớn hơn</li>
<li>Mỗi pixel cần 2 giá trị (giá trị + độ dài)</li>
</ul>
<p><strong>Kết luận:</strong> RLE chỉ hiệu quả với dữ liệu có nhiều chuỗi lặp dài.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-h%C3%B3a-symbol-based-jbig2">Mã hóa Symbol-based (JBIG2)</h1>
<ul>
<li><strong>Nguyên lý:</strong> Tạo từ điển các ký hiệu (ví dụ: ký tự 'a', 'b', hoặc các mẫu lặp lại).</li>
<li><strong>Cách hoạt động:</strong> Thay thế các vùng giống nhau trong ảnh bằng tọa độ và token tham chiếu đến từ điển.</li>
<li><strong>Ví dụ:</strong> Dữ liệu đầu vào là ảnh quét của chuỗi &quot;banana&quot;.<br />
<gap></gap></li>
</ul>
<p><img src="images/3.11.png" alt="" style="width:900px;" /></p>
<p><gap></gap></p>
<ul>
<li><strong>Giải mã:</strong> Giải nén từ điển ký hiệu và luồng tọa độ, sau đó &quot;dán&quot; (paste) các mẫu ký hiệu lên đúng vị trí (X, Y) trên nền trang trắng. Rất hiệu quả cho tài liệu văn bản quét.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-ho%C3%A1-bit-plane">Mã hoá bit-plane</h1>
<div class="columns">
<div class="col-4">
<ul>
<li><strong>Khái niệm:</strong> Biểu diễn một ảnh <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.986ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 878 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45A" d="M21 287Q22 293 24 303T36 341T56 388T88 425T132 442T175 435T205 417T221 395T229 376L231 369Q231 367 232 367L243 378Q303 442 384 442Q401 442 415 440T441 433T460 423T475 411T485 398T493 385T497 373T500 364T502 357L510 367Q573 442 659 442Q713 442 746 415T780 336Q780 285 742 178T704 50Q705 36 709 31T724 26Q752 26 776 56T815 138Q818 149 821 151T837 153Q857 153 857 145Q857 144 853 130Q845 101 831 73T785 17T716 -10Q669 -10 648 17T627 73Q627 92 663 193T700 345Q700 404 656 404H651Q565 404 506 303L499 291L466 157Q433 26 428 16Q415 -11 385 -11Q372 -11 364 -4T353 8T350 18Q350 29 384 161L420 307Q423 322 423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 181Q151 335 151 342Q154 357 154 369Q154 405 129 405Q107 405 92 377T69 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container>-bit bằng cách tách nó thành <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.986ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 878 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45A" d="M21 287Q22 293 24 303T36 341T56 388T88 425T132 442T175 435T205 417T221 395T229 376L231 369Q231 367 232 367L243 378Q303 442 384 442Q401 442 415 440T441 433T460 423T475 411T485 398T493 385T497 373T500 364T502 357L510 367Q573 442 659 442Q713 442 746 415T780 336Q780 285 742 178T704 50Q705 36 709 31T724 26Q752 26 776 56T815 138Q818 149 821 151T837 153Q857 153 857 145Q857 144 853 130Q845 101 831 73T785 17T716 -10Q669 -10 648 17T627 73Q627 92 663 193T700 345Q700 404 656 404H651Q565 404 506 303L499 291L466 157Q433 26 428 16Q415 -11 385 -11Q372 -11 364 -4T353 8T350 18Q350 29 384 161L420 307Q423 322 423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 181Q151 335 151 342Q154 357 154 369Q154 405 129 405Q107 405 92 377T69 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> ảnh nhị phân riêng biệt. Mỗi mặt phẳng bit chứa một bit tại cùng vị trí của tất cả pixel.</li>
<li><strong>Ví dụ:</strong> Với ảnh 8 bit, bit cao nhất chứa cấu trúc cường độ chính, các bit thấp hơn mô tả chi tiết tinh và dễ bị nhiễu hơn.</li>
</ul>
</div>
<div class="col-5">
<p><img src="images/3.12.png" alt="" /></p>
</div>
</div>
<ul>
<li><strong>Xử lý:</strong> Các bit-plane có thể được nén hoặc xử lý riêng tùy theo mức độ quan trọng.</li>
<li><strong>Giải mã:</strong> Dịch chuyển (shift) các bit của từng mặt phẳng nhị phân về lại đúng vị trí, thực hiện phép toán OR (|) để ghép <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.986ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 878 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45A" d="M21 287Q22 293 24 303T36 341T56 388T88 425T132 442T175 435T205 417T221 395T229 376L231 369Q231 367 232 367L243 378Q303 442 384 442Q401 442 415 440T441 433T460 423T475 411T485 398T493 385T497 373T500 364T502 357L510 367Q573 442 659 442Q713 442 746 415T780 336Q780 285 742 178T704 50Q705 36 709 31T724 26Q752 26 776 56T815 138Q818 149 821 151T837 153Q857 153 857 145Q857 144 853 130Q845 101 831 73T785 17T716 -10Q669 -10 648 17T627 73Q627 92 663 193T700 345Q700 404 656 404H651Q565 404 506 303L499 291L466 157Q433 26 428 16Q415 -11 385 -11Q372 -11 364 -4T353 8T350 18Q350 29 384 161L420 307Q423 322 423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 181Q151 335 151 342Q154 357 154 369Q154 405 129 405Q107 405 92 377T69 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> mặt phẳng thành ảnh gốc.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-class="section" data-theme="eaut" lang="en-US" class="section" data-marpit-pagination="50" style="--paginate:true;--class:section;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="n%C3%A9n-c%C3%B3-t%E1%BB%95n-th%E1%BA%A5t">NÉN CÓ TỔN THẤT</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="n%C3%A9n-c%C3%B3-t%E1%BB%95n-th%E1%BA%A5t---lossy-1">NÉN CÓ TỔN THẤT - LOSSY</h1>
<p><strong>Mục tiêu:</strong> Đạt tỷ lệ nén cao bằng cách loại bỏ những thông tin ít quan trọng hoặc khó nhận biết.</p>
<p><strong>Các hướng tiếp cận chính:</strong></p>
<div class="columns">
<div>
<p><strong>1. Transform Coding (Mã hóa biến đổi):</strong></p>
<ul>
<li>Biến đổi dữ liệu sang miền khác</li>
<li>Tập trung năng lượng vào ít hệ số</li>
<li>Ví dụ: DCT, DWT</li>
</ul>
<p><strong>2. Quantization (Lượng tử hóa):</strong></p>
<ul>
<li>Giảm số mức biểu diễn</li>
<li>Loại bỏ chi tiết nhỏ</li>
<li>Là bước chính gây mất mát</li>
</ul>
<p><strong>3. Predictive Coding (Mã hóa dự đoán):</strong></p>
<ul>
<li>Dự đoán giá trị pixel</li>
<li>Chỉ mã hóa sai số</li>
</ul>
</div>
<div>
<p><strong>4. Wavelet Coding (Mã hóa wavelet):</strong></p>
<ul>
<li>Phân tích đa phân giải</li>
<li>Biểu diễn ở nhiều mức chi tiết</li>
<li>Ví dụ: JPEG 2000</li>
</ul>
<p><strong>Nguyên lý chung:</strong></p>
<ul>
<li>Khai thác giới hạn của thị giác con người</li>
<li>Loại bỏ thông tin không quan trọng</li>
<li>Đánh đổi chất lượng để đạt tỷ lệ nén cao</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="t%E1%BA%A1i-sao-c%C3%B3-th%E1%BB%83-lo%E1%BA%A1i-b%E1%BB%8F-th%C3%B4ng-tin">TẠI SAO CÓ THỂ LOẠI BỎ THÔNG TIN?</h1>
<p><strong>Cơ sở sinh học:</strong> Hệ thống thị giác con người không nhạy như nhau với mọi loại thông tin.</p>
<p><strong>Các giới hạn của thị giác:</strong></p>
<div class="columns">
<div>
<p><strong>1. Nhạy cảm với thay đổi màu sắc:</strong></p>
<ul>
<li>Khó nhận ra một số thay đổi rất nhỏ về màu sắc</li>
<li>Đặc biệt trong vùng tối hoặc vùng quá sáng</li>
</ul>
<p><strong>2. Thành phần tần số:</strong></p>
<ul>
<li>Thành phần tần số cao (chi tiết nhỏ) ít quan trọng hơn tần số thấp (cấu trúc lớn)</li>
<li>Mắt người nhạy với tần số trung bình hơn</li>
</ul>
</div>
<div>
<p><strong>3. Độ phân giải:</strong></p>
<ul>
<li>Một số chi tiết nhỏ có thể bị bỏ qua trong ảnh có độ phân giải thấp</li>
<li>Không nhận biết được chi tiết nhỏ hơn ngưỡng</li>
</ul>
<p><strong>4. Vùng quan tâm:</strong></p>
<ul>
<li>Mắt tập trung vào vùng trung tâm</li>
<li>Vùng ngoại vi ít được chú ý</li>
</ul>
<p>⇒ Có thể giữ lại các thông tin quan trọng trong ảnh và bỏ đi các thông tin ít quan trọng.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-h%C3%B3a-bi%E1%BA%BFn-%C4%91%E1%BB%95i-kh%E1%BB%91i-block-transform-coding">Mã hóa biến đổi khối (Block Transform Coding)</h1>
<ul>
<li><strong>Mục tiêu:</strong> Loại bỏ dư thừa dữ liệu để giảm dung lượng mà vẫn giữ chất lượng ảnh ở mức chấp nhận được.</li>
<li><strong>Quy trình chi tiết:</strong>
<ol>
<li><strong>Chia khối (Blocking):</strong> Chia ảnh thành các khối pixel nhỏ (thường 8x8).</li>
<li><strong>Biến đổi (Transform):</strong> Chuyển đổi giá trị pixel thành hệ số tần số (phổ biến nhất là DCT - Discrete Cosine Transform).</li>
<li><strong>Lượng tử hóa (Quantization):</strong> Làm tròn các hệ số, loại bỏ thông tin ít quan trọng.</li>
<li><strong>Mã hóa (Coding):</strong> Mã hóa các hệ số đã lượng tử hóa (thường dùng Zigzag + RLE + Huffman).</li>
</ol>
</li>
</ul>
<p><img src="images/3.13.png" alt="" /></p>
<ul>
<li><strong>Phân bổ Bit:</strong> Zonal Coding (giữ hệ số có phương sai lớn nhất) hoặc Threshold Coding (giữ N hệ số có độ lớn tuyệt đối lớn nhất).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="minh-ho%E1%BA%A1-m%C3%A3-ho%C3%A1-kh%E1%BB%91i">Minh hoạ mã hoá khối</h1>
<div class="columns">
<div class="col-3">
<ul>
<li><strong>Đầu vào:</strong> Một khối pixel 8x8.</li>
<li><strong>Biến đổi DCT:</strong> Chuyển từ miền không gian sang miền tần số. Hệ số DC (góc trái trên) đại diện cho thành phần tần số thấp (thông tin nền), các hệ số AC đại diện cho tần số cao (chi tiết, biên).</li>
</ul>
</div>
<div class="col-5">
<p><img src="images/3.14.png" alt="" /></p>
</div>
</div>
<ul>
<li><strong>Lượng tử hóa:</strong> Chia các hệ số cho ma trận lượng tử hóa (Q-table) và làm tròn. Nhiều hệ số tần số cao trở thành 0.</li>
<li><strong>Mã hóa:</strong> Quét zigzag để gom các số 0 lại, sau đó dùng RLE và Huffman để mã hóa.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="gi%E1%BA%A3i-m%C3%A3-bi%E1%BA%BFn-%C4%91%E1%BB%95i-kh%E1%BB%91i">Giải mã Biến đổi khối</h1>
<ul>
<li><strong>Quy trình:</strong>
<ol>
<li><strong>Giải mã Entropy:</strong> Dùng Huffman/Arithmetic để giải mã luồng bit, khôi phục các hệ số DCT.</li>
<li><strong>Giải lượng tử hóa (Inverse Quantization):</strong> Nhân từng hệ số với giá trị tương ứng trong Ma trận lượng tử. (Lưu ý: Bước này gây tổn thất vĩnh viễn, các số 0 không thể khôi phục chính xác).</li>
<li><strong>Biến đổi ngược DCT (IDCT):</strong> Áp dụng IDCT lên khối <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="5.028ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 2222.4 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path></g><g data-mml-node="mo" transform="translate(722.2,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z"></path></g><g data-mml-node="mn" transform="translate(1722.4,0)"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path></g></g></g></svg></mjx-container> để chuyển ngược về miền không gian.</li>
<li><strong>Ghép khối:</strong> Đặt các khối <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="5.028ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 2222.4 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path></g><g data-mml-node="mo" transform="translate(722.2,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z"></path></g><g data-mml-node="mn" transform="translate(1722.4,0)"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path></g></g></g></svg></mjx-container> về đúng vị trí để tạo thành bức ảnh hoàn chỉnh.</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="m%C3%A3-h%C3%B3a-d%E1%BB%B1-%C4%91o%C3%A1n-predictive-codingdpcm">Mã hóa dự đoán (Predictive Coding/DPCM)</h1>

<h1 id="m%C3%A3-h%C3%B3a-wavelet">Mã hóa Wavelet</h1>
<ul>
<li><strong>Khái niệm:</strong> Phương pháp nén ảnh dùng biến đổi wavelet rời rạc (DWT). Khắc phục nhược điểm artifact khối của DCT (JPEG) khi nén tỷ lệ cao.</li>
<li><strong>Đặc trưng:</strong>
<ul>
<li>Biến đổi toàn ảnh, không chia khối.</li>
<li>Biểu diễn đa phân giải (multiresolution).</li>
<li>Hỗ trợ cả nén lossless và lossy.</li>
<li>Cho phép truyền ảnh tiến triển (progressive).</li>
</ul>
</li>
</ul>
<div class="columns">
<div>
<ul>
<li><strong>Chuẩn tiêu biểu:</strong> JPEG 2000.</li>
</ul>
</div>
<div class="col-3">
<gap></gap>
<p><img src="images/3.15.png" alt="" /></p>
</div>
</div>
<ul>
<li><strong>Các bước:</strong>
<ol>
<li>Biến đổi DWT: Ảnh <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> các băng con hệ số.</li>
<li>Lượng tử hóa: Chia mỗi hệ số cho bước lượng tử.</li>
<li>Mã hóa entropy: Dùng mã hóa bit-plane + mã hóa số học (EZW, SPIHT, EBCOT).</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="gi%E1%BA%A3i-m%C3%A3-wavelet">Giải mã Wavelet</h1>
<ul>
<li><strong>Quy trình:</strong>
<ol>
<li><strong>Giải mã Entropy:</strong> Giải mã luồng bit (thường dùng Arithmetic Coding kết hợp EZW, SPIHT, EBCOT) để khôi phục các hệ số Wavelet.</li>
<li><strong>Giải lượng tử hóa:</strong> Nhân các hệ số với bước lượng tử (hoặc dùng bước = 1 nếu là lossless).</li>
<li><strong>Biến đổi Wavelet ngược (IDWT):</strong> Tổng hợp lại ảnh từ các băng con (sub-bands) tần số thấp và cao để tạo ra ảnh ở độ phân giải gốc.</li>
</ol>
</li>
<li><strong>Ưu điểm:</strong> Quá trình này không gây ra hiệu ứng khối (blocking artifact) như JPEG thông thường, cho phép nén tỷ lệ cao mà vẫn giữ được độ mượt của ảnh.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="62" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="b%E1%BB%A9c-tranh-t%E1%BB%95ng-th%E1%BB%83-c%E1%BB%A7a-n%C3%A9n-%E1%BA%A3nh">BỨC TRANH TỔNG THỂ CỦA NÉN ẢNH</h1>
<p><strong>Ba ý tưởng nền tảng:</strong></p>
<div class="columns">
<div>
<p><strong>1. Coding Redundancy (Dư thừa mã hóa):</strong></p>
<ul>
<li>Khai thác phân bố xác suất không đều</li>
<li>Phương pháp: Statistical coding (Huffman, Arithmetic, Golomb)</li>
<li>Nguyên lý: Gán mã ngắn cho ký hiệu phổ biến</li>
</ul>
</div>
<div>
<p><strong>2. Spatial Redundancy (Dư thừa không gian):</strong></p>
<ul>
<li>Khai thác tương quan giữa các pixel lân cận</li>
<li>Phương pháp: Prediction / RLE (DPCM, RLE)</li>
<li>Nguyên lý: Chỉ mã hóa sự khác biệt</li>
</ul>
</div>
<div>
<p><strong>3. Irrelevant Information (Thông tin không liên quan):</strong></p>
<ul>
<li>Loại bỏ thông tin ít quan trọng</li>
<li>Phương pháp: Quantization (JPEG, JPEG 2000)</li>
<li>Nguyên lý: Đánh đổi chất lượng để đạt tỷ lệ nén cao</li>
</ul>
</div>
</div>
<p><strong>Kết luận:</strong> Mọi kỹ thuật nén đều dựa trên ba ý tưởng này, kết hợp theo cách khác nhau.</p>
</section>

<h1 id="so-s%C3%A1nh-c%C3%A1c-k%E1%BB%B9-thu%E1%BA%ADt-ti%C3%AAu-bi%E1%BB%83u">SO SÁNH CÁC KỸ THUẬT TIÊU BIỂU</h1>
<table>
<thead>
<tr>
<th>Kỹ thuật</th>
<th>Lossless</th>
<th>Lossy</th>
<th>Ý tưởng chính</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Huffman</strong></td>
<td>✓</td>
<td></td>
<td>Mã độ dài biến đổi theo tần suất</td>
</tr>
<tr>
<td><strong>Arithmetic</strong></td>
<td>✓</td>
<td></td>
<td>Mã hóa chuỗi bằng khoảng số thực</td>
</tr>
<tr>
<td><strong>Golomb-Rice</strong></td>
<td>✓</td>
<td></td>
<td>Mã hóa số nguyên nhỏ hiệu quả</td>
</tr>
<tr>
<td><strong>LZW</strong></td>
<td>✓</td>
<td></td>
<td>Từ điển chuỗi lặp lại</td>
</tr>
<tr>
<td><strong>RLE</strong></td>
<td>✓</td>
<td></td>
<td>Chuỗi giá trị giống nhau liên tiếp</td>
</tr>
<tr>
<td><strong>DPCM</strong></td>
<td>✓</td>
<td>✓</td>
<td>Mã hóa sai số dự đoán</td>
</tr>
<tr>
<td><strong>DCT</strong></td>
<td></td>
<td>✓</td>
<td>Biến đổi sang miền tần số</td>
</tr>
<tr>
<td><strong>DWT</strong></td>
<td>✓*</td>
<td>✓</td>
<td>Biến đổi wavelet đa phân giải</td>
</tr>
</tbody>
</table>
