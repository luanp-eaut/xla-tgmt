<p>Sau chương này, sinh viên có thể:</p>
<ol>
<li><strong>Phân biệt</strong> được miền không gian và miền tần số trong xử lý ảnh.</li>
<li><strong>Thực hiện</strong> các phép biến đổi cường độ để tăng cường ảnh.</li>
<li><strong>Hiểu và áp dụng</strong> các bộ lọc không gian để làm mịn và làm nét ảnh.</li>
<li><strong>Phân tích và xử lý</strong> ảnh dựa trên Histogram.</li>
<li><strong>Hiểu nguyên lý</strong> của biến đổi Fourier 2D.</li>
<li><strong>Thực hiện</strong> lọc ảnh trong miền tần số.</li>
<li><strong>Sử dụng</strong> Python, NumPy, OpenCV và Matplotlib để cài đặt các kỹ thuật cơ bản.</li>
</ol>
</section>

<h1 id="bi%E1%BA%BFn-%C4%91%E1%BB%95i-trong-mi%E1%BB%81n-kh%C3%B4ng-gian">BIẾN ĐỔI TRONG MIỀN KHÔNG GIAN</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="hai-c%C3%A1ch-nh%C3%ACn-v%E1%BB%81-%E1%BA%A3nh">HAI CÁCH NHÌN VỀ ẢNH</h1>
<div class="columns">
<div class="col-3">
<p><strong>Miền không gian (Spatial Domain)</strong></p>
<ul>
<li>Làm việc <strong>trực tiếp trên pixel</strong> của ảnh.</li>
<li>Quan tâm: <em>Pixel nằm ở đâu và có giá trị bao nhiêu?</em></li>
<li><strong>Ví dụ:</strong> Biến đổi cường độ, Mean Filter, Gaussian Filter, Median Filter, Sobel, Laplacian.</li>
</ul>
<p><strong>Miền tần số (Frequency Domain)</strong></p>
<ul>
<li>Biểu diễn ảnh bằng các <strong>thành phần tần số</strong>.</li>
<li>Quan tâm: <em>Ảnh thay đổi nhanh hay chậm?</em></li>
<li><strong>Ví dụ:</strong> Fourier Transform, Low-pass Filter, High-pass Filter, Band-reject Filter.</li>
</ul>
</div>
<div class="col-2">
<p><img src="images/mien_kg_ts.png" alt="" /></p>
</div>
</div>
<ul>
<li><strong>Ví dụ:</strong> Bức ảnh phi công trong miền không gian là ma trận các pixel; trong miền tần số, nó được mô tả bằng tập hợp các sóng sin/cosin với tần số và biên độ khác nhau.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="kh%C3%A1i-ni%E1%BB%87m-mi%E1%BB%81n-kh%C3%B4ng-gian">KHÁI NIỆM MIỀN KHÔNG GIAN</h1>
<ul>
<li><strong>Miền không gian (Spatial Domain)</strong> là chính mặt phẳng ảnh, trong đó các phương pháp xử lý tác động <strong>trực tiếp lên các pixel</strong>.</li>
<li>Hai nhóm biến đổi chính:
<ul>
<li><strong>Point Processing</strong> (Xử lý điểm): biến đổi từng pixel độc lập.</li>
<li><strong>Neighborhood Processing</strong> (Xử lý lân cận): biến đổi dựa trên vùng lân cận của pixel.</li>
</ul>
</li>
<li><strong>Ví dụ:</strong> Khi chỉnh độ sáng của một bức ảnh trên điện thoại → thực hiện Point Processing. Khi dùng chế độ &quot;làm mờ&quot; (blur) → dùng Neighborhood Processing vì giá trị mỗi pixel mới được tính từ các pixel xung quanh.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">

<h1 id="c%E1%BA%AFt-m%E1%BB%A9c-x%C3%A1m-gray-level-slicing">CẮT MỨC XÁM (GRAY-LEVEL SLICING)</h1>
<p><strong>Mục tiêu:</strong> Làm nổi bật một khoảng mức xám quan tâm (ROI - Region Of Interest).</p>
<p><strong>Cách thực hiện:</strong></p>
<ul>
<li>Giữ nguyên các mức xám ngoài khoảng.</li>
<li>Hoặc đưa toàn bộ vùng ngoài khoảng về một giá trị cố định.</li>
</ul>
<div class="columns">
<div>
<p><strong>Ứng dụng:</strong></p>
<ul>
<li>Làm nổi bật cấu trúc trong ảnh y tế.</li>
<li>Phân tích vật thể có khoảng cường độ đặc trưng.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trong ảnh vệ tinh, ta muốn làm nổi bật vùng nước (có mức xám 40-80) để phân tích sông hồ. Các vùng khác (đất, cây cối) được đưa về màu đen.</p>
</blockquote>
</div>
<div>
<p><img src="images/cat_xam.png" alt="" /></p>
</div>
</div>

<h1 id="l%E1%BB%8Dc-kh%C3%B4ng-gian">LỌC KHÔNG GIAN</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="kh%C3%A1i-ni%E1%BB%87m-l%E1%BB%8Dc-kh%C3%B4ng-gian-here">KHÁI NIỆM LỌC KHÔNG GIAN (here)</h1>
<p><strong>Spatial Filtering</strong> là kỹ thuật thay đổi giá trị pixel dựa trên các pixel trong <strong>vùng lân cận</strong>.</p>
<p><strong>Cơ chế hoạt động:</strong></p>
<ul>
<li>Một <strong>kernel</strong> (hay mask, window) có kích thước nhỏ (thường 3x3, 5x5, 7x7) được đặt lên ảnh.</li>
<li>Pixel trung tâm của kernel được tính toán lại dựa trên các pixel trong vùng kernel phủ lên.</li>
<li>Kernel được <strong>trượt</strong> qua toàn bộ ảnh để tạo ra ảnh đầu ra.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Khi dùng ứng dụng chỉnh ảnh để &quot;làm mờ&quot; một vùng, phần mềm đang áp dụng một kernel trung bình lên vùng lân cận của mỗi pixel.</p>
</blockquote>

<h1 id="ph%C3%A2n-lo%E1%BA%A1i-b%E1%BB%99-l%E1%BB%8Dc-kh%C3%B4ng-gian">PHÂN LOẠI BỘ LỌC KHÔNG GIAN</h1>
<p><strong>Smoothing Filters (Bộ lọc làm mịn / Low-pass)</strong></p>
<ul>
<li>Giảm nhiễu, làm mờ ảnh.</li>
<li>Giảm chi tiết nhỏ.</li>
<li>Làm giảm các thay đổi cường độ nhanh.</li>
</ul>
<p><strong>Sharpening Filters (Bộ lọc làm nét / High-pass)</strong></p>
<ul>
<li>Tăng cường chi tiết, làm nổi bật biên.</li>
<li>Tăng các thay đổi cường độ nhanh.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Bộ lọc Mean làm mờ ảnh (smoothing), trong khi bộ lọc Sobel làm nổi bật các đường biên (sharpening).</p>
</blockquote>
</section>

)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g><g data-mml-node="mrow" transform="translate(698,-515.3) scale(0.707)"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g><g data-mml-node="msup" transform="translate(500,0)"><g data-mml-node="mi"><path data-c="1D70E" d="M184 -11Q116 -11 74 34T31 147Q31 247 104 333T274 430Q275 431 414 431H552Q553 430 555 429T559 427T562 425T565 422T567 420T569 416T570 412T571 407T572 401Q572 357 507 357Q500 357 490 357T476 358H416L421 348Q439 310 439 263Q439 153 359 71T184 -11ZM361 278Q361 358 276 358Q152 358 115 184Q114 180 114 178Q106 141 106 117Q106 67 131 47T188 26Q242 26 287 73Q316 103 334 153T356 233T361 278Z"></path></g><g data-mml-node="mn" transform="translate(604,289)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g><rect width="2325.6" height="60" x="120" y="220"></rect></g></g></g></g></g></svg></mjx-container></p><p><strong>Đặc điểm:</strong></p>
<ul>
<li>Pixel gần tâm có trọng số lớn hơn, càng xa tâm trọng số càng nhỏ.</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.292ex" height="1ex" role="img" focusable="false" viewBox="0 -431 571 442"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D70E" d="M184 -11Q116 -11 74 34T31 147Q31 247 104 333T274 430Q275 431 414 431H552Q553 430 555 429T559 427T562 425T565 422T567 420T569 416T570 412T571 407T572 401Q572 357 507 357Q500 357 490 357T476 358H416L421 348Q439 310 439 263Q439 153 359 71T184 -11ZM361 278Q361 358 276 358Q152 358 115 184Q114 180 114 178Q106 141 106 117Q106 67 131 47T188 26Q242 26 287 73Q316 103 334 153T356 233T361 278Z"></path></g></g></g></svg></mjx-container> kiểm soát mức độ làm mờ.</li>
</ul>
<p><strong>Ưu điểm:</strong></p>
<ul>
<li>Làm mờ tự nhiên, giảm nhiễu tốt.</li>
<li>Thường được sử dụng trước các thuật toán phát hiện biên.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trong bộ lọc Gaussian 3x3, pixel trung tâm có trọng số lớn nhất (ví dụ 4/16), các pixel ở cạnh có trọng số nhỏ hơn (2/16), và pixel ở góc nhỏ nhất (1/16).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="b%E1%BB%99-l%E1%BB%8Dc-trung-v%E1%BB%8B-median-filter">BỘ LỌC TRUNG VỊ (MEDIAN FILTER)</h1>
<p><strong>Định nghĩa:</strong> Thay giá trị pixel trung tâm bằng <strong>trung vị</strong> (median) của các pixel trong vùng lân cận.</p>
<p><strong>Ví dụ:</strong> Với vùng 3x3 có các giá trị:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>10   12   11
 9  255   10
11   13   12
</code></pre>
<p>Sắp xếp: 9, 10, 10, 11, <strong>11</strong>, 12, 12, 13, 255<br />
→ Median = <strong>11</strong> (pixel nhiễu 255 đã bị loại bỏ)</p>
<p><strong>Ưu điểm:</strong></p>
<ul>
<li>Hiệu quả với nhiễu salt-and-pepper.</li>
<li>Bảo toàn biên tốt hơn bộ lọc trung bình.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Ảnh bị nhiễu muối tiêu (các chấm trắng/đen ngẫu nhiên) sẽ được khôi phục gần như hoàn toàn bằng Median Filter 3x3.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">

<h1 id="b%C3%A0i-t%E1%BA%ADp-th%E1%BB%B1c-h%C3%A0nh---l%C3%A0m-m%E1%BB%8Bn-%E1%BA%A3nh">BÀI TẬP THỰC HÀNH - LÀM MỊN ẢNH</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> cv2
<span class="hljs-keyword">import</span> matplotlib.pyplot <span class="hljs-keyword">as</span> plt

img = cv2.imread(<span class="hljs-string">&quot;input.jpg&quot;</span>, cv2.IMREAD_GRAYSCALE)
mean = cv2.blur(img, (<span class="hljs-number">5</span>, <span class="hljs-number">5</span>))
gaussian = cv2.GaussianBlur(img, (<span class="hljs-number">5</span>, <span class="hljs-number">5</span>), <span class="hljs-number">0</span>)
median = cv2.medianBlur(img, <span class="hljs-number">5</span>)
</code></pre>
<p><strong>Yêu cầu:</strong></p>
<ul>
<li>Hiển thị và so sánh 4 ảnh: Original, Mean, Gaussian, Median.</li>
<li>Quan sát tác động lên chi tiết và biên.</li>
<li>Nhận xét bộ lọc nào phù hợp với loại nhiễu nào.</li>
</ul>
</section>

<h1 id="l%C3%A0m-n%C3%A9t-%E1%BA%A3nh">LÀM NÉT ẢNH</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">

<li>Sobel thường được sử dụng phổ biến hơn trong thực tế.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trên ảnh có nhiễu, Sobel cho kết quả biên rõ ràng hơn Prewitt do kernel của nó có tính làm mịn tốt hơn.</p>
</blockquote>
</section>

<h1 id="b%C3%A0i-t%E1%BA%ADp-th%E1%BB%B1c-h%C3%A0nh---ph%C3%A1t-hi%E1%BB%87n-bi%C3%AAn-v%E1%BB%9Bi-sobel">BÀI TẬP THỰC HÀNH - PHÁT HIỆN BIÊN VỚI SOBEL</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">sobel_x = cv2.Sobel(img, cv2.CV_64F, <span class="hljs-number">1</span>, <span class="hljs-number">0</span>, ksize=<span class="hljs-number">3</span>)
sobel_y = cv2.Sobel(img, cv2.CV_64F, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, ksize=<span class="hljs-number">3</span>)
magnitude = cv2.magnitude(
    sobel_x.astype(<span class="hljs-string">&quot;float32&quot;</span>),
    sobel_y.astype(<span class="hljs-string">&quot;float32&quot;</span>)
)
</code></pre>
<p><strong>Hiển thị:</strong></p>
<ul>
<li>Original → Sobel X → Sobel Y → Gradient Magnitude</li>
</ul>
<p><strong>Yêu cầu:</strong> Nhận xét sự khác biệt giữa biên ngang (thấy rõ ở Sobel X) và biên dọc (thấy rõ ở Sobel Y).</p>
</section>

<h1 id="so-s%C3%A1nh-c%C3%A1c-ph%C6%B0%C6%A1ng-ph%C3%A1p-l%C3%A0m-n%C3%A9t">SO SÁNH CÁC PHƯƠNG PHÁP LÀM NÉT</h1>
<table>
<thead>
<tr>
<th>Phương pháp</th>
<th>Cơ sở</th>
<th>Ưu điểm</th>

</tr>
</thead>

<tr>

</tr>
<tr>
<td><strong>Sobel</strong></td>

<h1 id="b%C3%A0i-t%E1%BA%ADp-th%E1%BB%B1c-h%C3%A0nh---sharpening">BÀI TẬP THỰC HÀNH - SHARPENING</h1>
<p><strong>Yêu cầu:</strong> Với cùng một ảnh, thực hiện:</p>
<ol>
<li>Làm nét bằng Laplacian.</li>
<li>Làm nét bằng Unsharp Masking.</li>
<li>Làm nét bằng Highboost.</li>
<li>So sánh với Sobel.</li>
</ol>
<p><strong>Đánh giá theo các tiêu chí:</strong></p>
<ul>
<li>Độ sắc nét.</li>
<li>Biên.</li>
<li>Nhiễu.</li>
<li>Halo.</li>
<li>Khả năng giữ chi tiết.</li>
</ul>
</section>

<h1 id="histogram-cho-bi%E1%BA%BFt-%C4%91i%E1%BB%81u-g%C3%AC">HISTOGRAM CHO BIẾT ĐIỀU GÌ?</h1>
<ul>
<li><strong>Ảnh tối:</strong> Histogram tập trung về bên trái (gần 0).</li>
<li><strong>Ảnh sáng:</strong> Histogram tập trung về bên phải (gần 255).</li>
<li><strong>Tương phản thấp:</strong> Histogram tập trung trong một khoảng hẹp.</li>
<li><strong>Tương phản cao:</strong> Histogram trải rộng trên một khoảng lớn.</li>
</ul>
<p><strong>Lưu ý quan trọng:</strong> Histogram <strong>không chứa thông tin vị trí không gian</strong> của pixel.</p>
<blockquote>
<p><strong>Ví dụ:</strong> Hai ảnh hoàn toàn khác nhau (một ảnh bầu trời, một ảnh khuôn mặt) có thể có cùng histogram nếu phân bố mức xám giống nhau. Đây là hạn chế lớn nhất của histogram.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%E1%BB%A9ng-d%E1%BB%A5ng-c%E1%BB%A7a-histogram">ỨNG DỤNG CỦA HISTOGRAM</h1>
<p><strong>Phân tích ảnh:</strong></p>
<ul>
<li>Độ sáng, độ tương phản, phân bố mức xám.</li>
</ul>
<p><strong>Tăng cường ảnh:</strong></p>
<ul>
<li>Histogram Equalization, Histogram Matching, Local Enhancement.</li>
</ul>
<p><strong>Phân đoạn ảnh:</strong></p>
<ul>
<li>Hỗ trợ lựa chọn ngưỡng: Thresholding, Otsu.</li>
</ul>
<p><strong>Chuẩn hóa:</strong></p>
<ul>
<li>So sánh hoặc điều chỉnh ảnh có điều kiện chiếu sáng khác nhau.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trong nhận dạng khuôn mặt, histogram của vùng da mặt thường có phân bố đặc trưng, giúp phân biệt da người với nền.</p>
</blockquote>
</section>

<h1 id="c%C6%A1-ch%E1%BA%BF-c%C3%A2n-b%E1%BA%B1ng-histogram">CƠ CHẾ CÂN BẰNG HISTOGRAM</h1>
<p><strong>Quy trình:</strong></p>
<ol>
<li>Tính histogram gốc.</li>
<li>Tính xác suất <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.94ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2183.4 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g><g data-mml-node="mo" transform="translate(503,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="msub" transform="translate(892,0)"><g data-mml-node="mi"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q161 442 183 430T214 408T225 388Q227 382 228 382T236 389Q284 441 347 441H350Q398 441 422 400Q430 381 430 363Q430 333 417 315T391 292T366 288Q346 288 334 299T322 328Q322 376 378 392Q356 405 342 405Q286 405 239 331Q229 315 224 298T190 165Q156 25 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 <li>Tính CDF (hàm phân phối tích lũy).</li>
<li>Dùng CDF làm hàm ánh xạ.</li>
<li>Áp dụng lên từng pixel để có histogram mới.</li>
<li>Ảnh có tương phản được cải thiện.</li>
</ol>
<p><strong>Lưu ý:</strong> Histogram sau cân bằng <strong>không nhất thiết phẳng hoàn toàn</strong> vì:</p>
<ul>
<li>Pixel là dữ liệu rời rạc.</li>
<li>Số mức cường độ hữu hạn.</li>
<li>Phép ánh xạ có làm tròn.</li>
</ul>
</section>

<h1 id="h%E1%BA%A1n-ch%E1%BA%BF-c%E1%BB%A7a-histogram-equalization">HẠN CHẾ CỦA HISTOGRAM EQUALIZATION</h1>
<p><strong>Histogram Equalization toàn cục có thể:</strong></p>
<ul>
<li>Khuếch đại nhiễu.</li>
<li>Làm thay đổi quá mạnh độ sáng.</li>
<li>Không xử lý tốt ảnh có nhiều vùng sáng/tối khác nhau.</li>
<li>Làm mất một số chi tiết cục bộ.</li>
</ul>
<p><strong>Giải pháp:</strong> Cần các phương pháp <strong>local/adaptive enhancement</strong> như CLAHE.</p>
<blockquote>
<p><strong>Ví dụ:</strong> Ảnh có cả vùng bầu trời sáng và vùng đất tối. Histogram Equalization toàn cục có thể làm bầu trời bị cháy sáng trong khi cố gắng làm sáng vùng đất.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="kh%E1%BB%9Bp-histogram-histogram-matching">KHỚP HISTOGRAM (HISTOGRAM MATCHING)</h1>
<p><strong>Mục tiêu:</strong> Biến đổi ảnh đầu vào để histogram của nó <strong>gần với một histogram mục tiêu</strong>.</p>
<p><strong>Quy trình:</strong></p>
<ol>
<li>Tính CDF của ảnh đầu vào sau equalization.</li>
<li>Tính CDF của ảnh mục tiêu sau equalization.</li>
<li>Tìm hàm ánh xạ từ CDF đầu vào sang CDF mục tiêu.</li>
<li>Áp dụng hàm ánh xạ lên ảnh đầu vào.</li>
</ol>
<p><strong>Ứng dụng:</strong></p>
<ul>
<li>Chuẩn hóa ảnh.</li>
<li>Xử lý ảnh y tế, ảnh vệ tinh.</li>
<li>Các hệ thống cần đưa ảnh về một phân bố tham chiếu.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trong y tế, các ảnh X-quang chụp ở các máy khác nhau có histogram khác nhau. Histogram Matching giúp đưa tất cả về cùng một phân bố để bác sĩ dễ so sánh.</p>
</blockquote>
</section>

<h1 id="x%E1%BB%AD-l%C3%BD-histogram-c%E1%BB%A5c-b%E1%BB%99-local-histogram">XỬ LÝ HISTOGRAM CỤC BỘ (LOCAL HISTOGRAM)</h1>

<p><strong>Tại mỗi vị trí:</strong></p>
<ol>
<li>Xác định vùng lân cận.</li>
<li>Tính histogram cục bộ.</li>
<li>Thực hiện biến đổi (ví dụ: equalization).</li>
<li>Cập nhật pixel trung tâm.</li>
</ol>
<p><strong>Ưu điểm:</strong> Tăng cường chi tiết cục bộ.</p>
<p><strong>Nhược điểm:</strong> Tốn chi phí tính toán, có thể khuếch đại nhiễu.</p>
<blockquote>
<p><strong>Ví dụ:</strong> Trong ảnh có cả vùng sáng và tối, local histogram processing có thể tăng cường chi tiết ở cả hai vùng mà không làm ảnh hưởng lẫn nhau.</p>
</blockquote>
</section>

<h1 id="clahe-contrast-limited-adaptive-histogram-equalization">CLAHE (CONTRAST LIMITED ADAPTIVE HISTOGRAM EQUALIZATION)</h1>
<p><strong>Định nghĩa:</strong> CLAHE là phương pháp tăng cường tương phản cục bộ có giới hạn.</p>
<p><strong>Quy trình:</strong></p>
<ol>
<li>Chia ảnh thành các tile (ví dụ 8x8).</li>
<li>Tính histogram từng tile.</li>
<li>Giới hạn clipping (clip limit) để tránh khuếch đại nhiễu.</li>
<li>Equalization trên từng tile.</li>
<li>Nội suy giữa các tile để tránh biên cứng.</li>
</ol>
<p><strong>So sánh với AHE (Adaptive HE):</strong></p>
<ul>
<li>AHE: Có thể khuếch đại nhiễu mạnh.</li>
<li>CLAHE: Giới hạn mức khuếch đại histogram thông qua clip limit.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trong ảnh nội tạng y tế, CLAHE giúp làm rõ chi tiết ở cả vùng sáng và tối mà không tạo ra nhiễu quá mức ở vùng đồng nhất.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="b%C3%A0i-t%E1%BA%ADp-th%E1%BB%B1c-h%C3%A0nh---histogram">BÀI TẬP THỰC HÀNH - HISTOGRAM</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> cv2

eq = cv2.equalizeHist(img)
clahe = cv2.createCLAHE(clipLimit=<span class="hljs-number">2.0</span>, tileGridSize=(<span class="hljs-number">8</span>, <span class="hljs-number">8</span>))
clahe_img = clahe.apply(img)
</code></pre>
<p><strong>Yêu cầu:</strong></p>
<ul>
<li>So sánh 3 ảnh: Original, Histogram Equalization, CLAHE.</li>
<li>Vẽ histogram của cả ba ảnh.</li>
<li>Nhận xét sự khác biệt về tương phản và nhiễu.</li>
</ul>
</section>

<h1 id="t%E1%BA%A7n-s%E1%BB%91-th%E1%BA%A5p-v%C3%A0-t%E1%BA%A7n-s%E1%BB%91-cao">TẦN SỐ THẤP VÀ TẦN SỐ CAO</h1>
<p><strong>Low Frequency (Tần số thấp):</strong></p>
<ul>
<li>Ảnh thay đổi chậm.</li>
<li>Vùng nền, vùng tương đối đồng nhất.</li>
<li>Biến thiên ánh sáng, các cấu trúc lớn.</li>
</ul>
<p><strong>High Frequency (Tần số cao):</strong></p>
<ul>
<li>Ảnh thay đổi nhanh.</li>
<li>Biên, chi tiết nhỏ, texture, nhiễu.</li>
</ul>
<p><strong>Ghi nhớ:</strong></p>
<ul>
<li>Smooth region → Low frequency</li>
<li>Sharp edge → High frequency</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Vùng bầu trời xanh đồng nhất là tần số thấp. Đường biên giữa tóc và nền là tần số cao. Nhiễu muối tiêu cũng là tần số cao.</p>
</blockquote>
</section>

<h1 id="fourier-magnitude-spectrum">FOURIER MAGNITUDE SPECTRUM</h1>
<p><strong>Khi dịch phổ để thành phần DC nằm ở giữa:</strong></p>
<p><strong>Tại tâm (DC component):</strong></p>
<ul>
<li>Tần số thấp nhất.</li>
<li>Liên quan đến mức sáng trung bình của ảnh.</li>
</ul>
<p><strong>Càng xa tâm:</strong></p>
<ul>
<li>Tần số càng cao.</li>
<li>Chi tiết nhanh, biên, texture, nhiễu.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Trong phổ Fourier của ảnh khuôn mặt, tâm phổ sáng (DC) thể hiện độ sáng trung bình, các điểm sáng xa tâm thể hiện các chi tiết như mắt, mũi, miệng.</p>
</blockquote>
</section>

<p><strong>Tính phân tách (Separability):</strong> 2D DFT có thể thực hiện bằng:</p>
<ol>
<li>DFT theo hàng.</li>
<li>DFT theo cột.</li>
</ol>
<p><strong>Tính dịch chuyển:</strong> Dịch ảnh trong miền không gian làm thay đổi phase, nhưng <strong>không làm thay đổi magnitude</strong>.</p>
<blockquote>
<p><strong>Ví dụ:</strong> Nhờ tính phân tách, 2D FFT của ảnh 1024x1024 chỉ cần thực hiện 2048 phép FFT 1D kích thước 1024, nhanh hơn nhiều so với tính trực tiếp.</p>
</blockquote>
</section>

<h1 id="t%E1%BB%AB-spatial-filter-%C4%91%E1%BA%BFn-frequency-filter">TỪ SPATIAL FILTER ĐẾN FREQUENCY FILTER</h1>
<table>
<thead>
<tr>
<th>Miền không gian</th>
<th>Miền tần số</th>
</tr>
</thead>
<tbody>
<tr>
<td>Mean Filter</td>
<td>Low-pass</td>
</tr>
<tr>
<td>Gaussian Filter</td>
<td>Gaussian LPF</td>
</tr>
<tr>
<td>Sharpening</td>
<td>High-pass</td>
</tr>
<tr>
<td>Laplacian</td>
<td>Laplacian frequency filter</td>
</tr>
<tr>
<td>Unsharp Masking</td>
<td>High-frequency emphasis</td>
</tr>
</tbody>
</table>
<p><strong>Ý tưởng cốt lõi:</strong> Lọc trong hai miền là <strong>hai cách biểu diễn khác nhau</strong> của cùng một bài toán xử lý tín hiệu.</p>
<blockquote>
<p><strong>Ví dụ:</strong> Bộ lọc Mean trong miền không gian (tính trung bình các pixel lân cận) tương đương với bộ lọc Low-pass trong miền tần số (giữ tần số thấp, loại tần số cao).</p>
</blockquote>
</section>

<h1 id="kh%C3%A1i-ni%E1%BB%87m-low-pass-filter">KHÁI NIỆM LOW-PASS FILTER</h1>
<p><strong>Mục tiêu:</strong> Giữ các thành phần <strong>tần số thấp</strong> và loại bỏ/giảm các thành phần <strong>tần số cao</strong>.</p>
<p><strong>Hiệu ứng:</strong></p>
<ul>
<li>Làm mịn, làm mờ ảnh.</li>
<li>Giảm nhiễu.</li>
<li>Giảm chi tiết nhỏ.</li>
</ul>
<p><strong>Trong phổ đã dịch tâm:</strong></p>
<ul>
<li>Vùng trung tâm (tần số thấp) được giữ lại.</li>
<li>Vùng biên (tần số cao) bị loại bỏ.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Khi áp dụng LPF lên ảnh có nhiễu, các chấm nhiễu (tần số cao) bị loại bỏ, ảnh trở nên mượt mà hơn nhưng cũng mờ hơn.</p>
</blockquote>
</section>

<h1 id="kh%C3%A1i-ni%E1%BB%87m-high-pass-filter">KHÁI NIỆM HIGH-PASS FILTER</h1>
<p><strong>Mục tiêu:</strong> Giữ các thành phần <strong>tần số cao</strong> và loại bỏ/giảm các thành phần <strong>tần số thấp</strong>.</p>
<p><strong>Ứng dụng:</strong></p>
<ul>
<li>Làm nét ảnh.</li>
<li>Tăng cường biên.</li>
<li>Tăng cường chi tiết.</li>
</ul>
<p><strong>Trong phổ đã dịch tâm:</strong></p>
<ul>
<li>Vùng trung tâm (tần số thấp, DC) bị loại bỏ.</li>
<li>Vùng biên (tần số cao) được giữ lại.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Khi áp dụng HPF lên ảnh, các vùng đồng nhất (bầu trời, tường) trở nên tối, trong khi các đường biên (chữ, đường kẻ) được làm nổi bật.</p>
</blockquote>
</section>

<h1 id="notch-filter">NOTCH FILTER</h1>
<p><strong>Định nghĩa:</strong> Notch filter tác động vào một hoặc một số <strong>vùng tần số rất cụ thể</strong>.</p>
<p><strong>Đặc biệt hữu ích với:</strong> Periodic noise (nhiễu tuần hoàn).</p>
<p><strong>Quy trình:</strong></p>
<ol>
<li>Ảnh có nhiễu tuần hoàn.</li>
<li>Biến đổi Fourier.</li>
<li>Phát hiện các đỉnh bất thường trong phổ.</li>
<li>Thiết kế Notch Filter tại các vị trí đỉnh.</li>
<li>Biến đổi Fourier ngược.</li>
<li>Ảnh giảm nhiễu.</li>
</ol>
<blockquote>
<p><strong>Ví dụ:</strong> Ảnh chụp từ camera an ninh bị nhiễu vân (moiré pattern) do interference với màn hình. Các đỉnh nhiễu xuất hiện đối xứng trong phổ Fourier và có thể loại bỏ bằng Notch Filter.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="eaut" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="nhi%E1%BB%85u-tu%E1%BA%A7n-ho%C3%A0n-trong-mi%E1%BB%81n-t%E1%BA%A7n-s%E1%BB%91">NHIỄU TUẦN HOÀN TRONG MIỀN TẦN SỐ</h1>
<p><strong>Đặc điểm:</strong> Nhiễu tuần hoàn trong miền không gian thường tạo ra các <strong>đỉnh sáng đối xứng</strong> trong Fourier spectrum.</p>
<p><strong>Vị trí các đỉnh:</strong> Đối xứng qua tâm phổ.</p>
<p><strong>Cách xử lý:</strong></p>
<ul>
<li>Tìm nhiễu trong miền tần số.</li>
<li>Loại bỏ đúng vùng tần số tương ứng.</li>
<li>Khôi phục ảnh.</li>
</ul>
<blockquote>
<p><strong>Ví dụ:</strong> Ảnh scan từ báo giấy có các đường sọc ngang do cảm biến máy scan. Trong phổ Fourier, các đường sọc này tạo ra các đỉnh sáng ở vị trí cụ thể, và Notch Filter có thể loại bỏ chúng.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-class="section" data-theme="eaut" lang="en-US" class="section" data-marpit-pagination="78" style="--paginate:true;--class:section;--theme:eaut;" data-marpit-pagination-total="89" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">

</section>

<h1 id="hi%E1%BB%83n-th%E1%BB%8B-fourier-spectrum">HIỂN THỊ FOURIER SPECTRUM</h1>

<h1 id="b%C3%A0i-t%E1%BA%ADp-th%E1%BB%B1c-h%C3%A0nh---fft--low-pass">BÀI TẬP THỰC HÀNH - FFT + LOW-PASS</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> cv2
<span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np
<span class="hljs-keyword">import</span> matplotlib.pyplot <span class="hljs-keyword">as</span> plt

img = cv2.imread(<span class="hljs-string">&quot;input.jpg&quot;</span>, cv2.IMREAD_GRAYSCALE)
F = np.fft.fft2(img)
F_shift = np.fft.fftshift(F)
rows, cols = img.shape
crow, ccol = rows // <span class="hljs-number">2</span>, cols // <span class="hljs-number">2</span>
y, x = np.ogrid[:rows, :cols]
D = np.sqrt((x - ccol)**<span class="hljs-number">2</span> + (y - crow)**<span class="hljs-number">2</span>)
D0 = <span class="hljs-number">50</span>
mask = (D &lt;= D0).astype(np.float32)
F_filtered = F_shift * mask
F_ishift = np.fft.ifftshift(F_filtered)
result = np.fft.ifft2(F_ishift)
result = np.<span class="hljs-built_in">abs</span>(result)
</code></pre>
</section>

<blockquote>
<p><strong>Sơ đồ tư duy:</strong> Biến đổi ảnh chia thành hai nhánh lớn - Spatial Domain (xử lý trực tiếp trên pixel) và Frequency Domain (xử lý qua biến đổi Fourier), với Histogram là công cụ phân tích hỗ trợ cả hai miền.</p>
</blockquote>

<h1 id="ki%E1%BA%BFn-th%E1%BB%A9c-c%E1%BA%A7n-ghi-nh%E1%BB%9B">KIẾN THỨC CẦN GHI NHỚ</h1>
<ol>
<li><strong>Point processing:</strong> Mỗi pixel được xử lý độc lập.</li>
<li><strong>Spatial filtering:</strong> Giá trị pixel mới phụ thuộc vào vùng lân cận.</li>
<li><strong>Smoothing:</strong> Giảm high-frequency → giảm chi tiết và nhiễu.</li>
<li><strong>Sharpening:</strong> Tăng high-frequency → tăng biên và chi tiết.</li>
<li><strong>Histogram:</strong> Mô tả phân bố cường độ, nhưng không chứa thông tin vị trí.</li>
<li><strong>Fourier Transform:</strong> Chuyển cách nhìn từ pixel sang frequency components.</li>
<li><strong>Frequency filtering:</strong> Thay đổi các thành phần tần số để thay đổi đặc tính ảnh.</li>
</ol>
<blockquote>
<p><strong>Thông điệp cuối chương:</strong> Hiểu rõ hai miền biểu diễn ảnh và mối liên hệ giữa chúng là nền tảng để lựa chọn phương pháp xử lý phù hợp cho từng bài toán cụ thể trong thực tế.</p>
</blockquote>
